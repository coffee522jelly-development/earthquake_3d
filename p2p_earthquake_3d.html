<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071018);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 5000);
camera.position.set(0, 420, 520);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled = true;
document.querySelector('#app').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(200, 400, 300);
scene.add(dirLight);

const worldGroup = new THREE.Group();
scene.add(worldGroup);

const grid = new THREE.GridHelper(900, 30, 0x30414c, 0x17242d);
grid.rotation.x = 0;
worldGroup.add(grid);

// 日本の緯度経度をThree.jsのローカル座標へ。
// 地図はおおよそ日本全体が画面に入るスケール。
const LON0 = 137.0;
const LAT0 = 36.0;
const SX = 28;
const SZ = 32;
const DEPTH_SCALE = 3.0;

// 山の標高データ近似関数 (日本列島の主要山脈・山地)
function getElevation(lon, lat) {
  let h = 0;
  function peak(cx, cy, radius, height) {
    const dx = lon - cx;
    const dy = lat - cy;
    const distSq = dx * dx + dy * dy;
    if (distSq < radius * radius) {
      h += height * Math.exp(-distSq / (radius * radius * 0.4));
    }
  }
  // 日本アルプス（飛騨・木曽・赤石山脈）および 富士山
  peak(137.8, 36.1, 1.2, 16.0);
  peak(138.2, 35.8, 1.0, 14.0);
  peak(138.73, 35.36, 0.45, 22.0); // 富士山
  peak(138.8, 36.0, 0.8, 10.0);
  // 奥羽山脈・東北脊梁
  for (let latI = 37.0; latI <= 40.8; latI += 0.4) {
    peak(140.5, latI, 0.7, 9.0);
  }
  // 北海道（大雪山系・日高山脈）
  peak(142.8, 43.6, 1.2, 12.0);
  peak(142.6, 42.5, 0.9, 10.0);
  // 紀伊山地
  peak(135.9, 34.2, 0.9, 10.0);
  // 四国山地
  peak(133.2, 33.7, 0.9, 11.0);
  // 中国山地
  peak(133.5, 35.3, 0.8, 8.0);
  // 九州山地（阿蘇・九重・霧島）
  peak(131.1, 32.8, 0.9, 10.0);
  peak(130.8, 31.9, 0.8, 8.0);

  return h;
}

function geoTo3D(lon, lat, depth=0, surfaceOffset=0) {
  // 震源 (depth > 0) 以外の地表フィーチャ (活断層・境界線等) は標高getElevationを常に反映
  const elev = getElevation(lon, lat);
  const y = (depth > 0) ? -depth * DEPTH_SCALE : (elev + surfaceOffset);
  return new THREE.Vector3(
    (lon - LON0) * SX,
    y,
    -(lat - LAT0) * SZ
  );
}

// 2点間(lon1, lat1) -> (lon2, lat2) を細分化して地形(3D標高)に綺麗に沿わせる
function interpolateLine(coords, maxStep = 0.05, surfaceOffset = 0.6) {
  const resultPts = [];
  for (let i = 0; i < coords.length - 1; i++) {
    const p1 = coords[i];
    const p2 = coords[i + 1];
    const dx = p2[0] - p1[0];
    const dy = p2[1] - p1[1];
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / maxStep));

    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const lon = p1[0] + dx * t;
      const lat = p1[1] + dy * t;
      resultPts.push(geoTo3D(lon, lat, 0, surfaceOffset));
    }
  }
  const last = coords[coords.length - 1];
  resultPts.push(geoTo3D(last[0], last[1], 0, surfaceOffset));
  return resultPts;
}

const mapGroup = new THREE.Group();
worldGroup.add(mapGroup);

const faultGroup = new THREE.Group();
worldGroup.add(faultGroup);

const jshisGroup = new THREE.Group();
worldGroup.add(jshisGroup);
jshisGroup.visible = false;

let mapLineMat, mapFillMat, faultLineMat;

// GeoJSONをThree.jsの線として描画
function addGeoJSON(obj) {
  mapLineMat = new THREE.LineBasicMaterial({color:0x8fa9b8});
  mapFillMat = new THREE.MeshStandardMaterial({
    color:0x152c38,
    roughness: 0.8,
    metalness: 0.1,
    transparent:true,
    opacity:.85,
    side:THREE.DoubleSide
  });

  function polygon(coords) {
    const shape = new THREE.Shape();
    coords.forEach((p,i)=>{
      const v=geoTo3D(p[0],p[1],0);
      if(i===0) shape.moveTo(v.x,-v.z); else shape.lineTo(v.x,-v.z);
    });
    shape.closePath();

    const geo = new THREE.ShapeGeometry(shape);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = -pos.getY(i); // rotation.x = -Math.PI/2 を考慮
      const lon = LON0 + vx / SX;
      const lat = LAT0 - vz / SZ;
      const elev = getElevation(lon, lat);
      pos.setZ(i, elev);
    }
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo,mapFillMat);
    mesh.rotation.x=-Math.PI/2;
    mapGroup.add(mesh);

    // 都道府県境界線を細分化して3D地形に沿わせる (表面オフセット +0.35)
    const linePts = interpolateLine(coords, 0.05, 0.35);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
    mapGroup.add(new THREE.Line(lineGeo,mapLineMat));
  }

  function geometry(g) {
    if(g.type==='Polygon') g.coordinates.forEach(polygon);
    if(g.type==='MultiPolygon') g.coordinates.forEach(mp=>mp.forEach(polygon));
  }
  obj.features.forEach(f=>geometry(f.geometry));
}

// 公開GeoJSON（都道府県境）
const GEOJSON_URL='https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson';

// 30年以内の発生確率ランク別カラー定義
// Sランク (≥3%): #ef4444 (赤)
// Aランク (0.1%〜3%): #f97316 (オレンジ)
// その他主要活断層帯: #eab308 (黄)
// プレート境界・海溝: #ec4899 (マゼンタ)

const MAJOR_FAULTS = [

  { color: COLOR_TROUGH, width: 3.8, coords: [[139.0, 34.8], [140.5, 35.0], [142.0, 36.5], [143.5, 38.5], [144.5, 40.5], [145.0, 42.0]] }, // 日本海溝・相模トラフ
  { color: COLOR_TROUGH, width: 3.8, coords: [[145.0, 42.0], [147.0, 43.5], [149.0, 45.0]] }, // 千島海溝
  { color: COLOR_TROUGH, width: 3.8, coords: [[123.0, 24.0], [126.0, 26.5], [129.0, 29.0], [130.5, 30.5]] }, // 琉球トラフ

  // --- 大構造線 ---
  { color: COLOR_A_RANK, width: 2.2, coords: [[130.0, 32.5], [132.5, 33.5], [134.5, 34.0], [136.5, 34.5], [138.0, 35.0]] }, // 中央構造線
  { color: COLOR_S_RANK, width: 2.8, coords: [[137.8, 37.0], [137.9, 36.3], [138.2, 35.7], [138.5, 35.0]] }, // 糸魚川-静岡構造線 (Sランク)
  { color: COLOR_A_RANK, width: 2.2, coords: [[139.5, 41.5], [139.2, 40.0], [138.8, 38.5], [137.5, 37.0]] }, // 日本海東縁変動帯

  // --- Sランク活断層帯 (30年確率 3%以上) ---
  { color: COLOR_S_RANK, width: 2.6, coords: [[130.22, 33.72], [130.31, 33.65], [130.40, 33.58], [130.50, 33.48], [130.58, 33.40]] }, // 警固断層帯 (南東部約6%)
  { color: COLOR_S_RANK, width: 2.6, coords: [[131.20, 33.00], [131.00, 32.88], [130.80, 32.78], [130.60, 32.55], [130.45, 32.30]] }, // 布田川・日奈久断層帯
  { color: COLOR_S_RANK, width: 2.6, coords: [[134.90, 34.50], [135.02, 34.60], [135.18, 34.72], [135.32, 34.82]] }, // 六甲・淡路島断層帯
  { color: COLOR_S_RANK, width: 2.6, coords: [[138.05, 36.50], [138.25, 36.70], [138.45, 36.90]] }, // 長野盆地西縁断層帯
  { color: COLOR_S_RANK, width: 2.6, coords: [[136.60, 36.45], [136.70, 36.60]] }, // 森本・富樫断層帯

  // --- Aランク活断層帯 (30年確率 0.1%〜3%) ---
  { color: COLOR_A_RANK, width: 2.0, coords: [[139.22, 35.68], [139.35, 35.75], [139.42, 35.82]] }, // 立川断層帯
  { color: COLOR_A_RANK, width: 2.0, coords: [[139.55, 35.20], [139.70, 35.25]] }, // 三浦半島断層群
  { color: COLOR_A_RANK, width: 2.0, coords: [[136.80, 36.20], [137.15, 36.35], [137.50, 36.48]] }, // 跡津川断層帯
  { color: COLOR_A_RANK, width: 2.0, coords: [[136.50, 35.40], [136.62, 35.60], [136.75, 35.80]] }, // 根尾谷断層帯
  { color: COLOR_A_RANK, width: 2.0, coords: [[133.90, 34.95], [134.30, 35.05], [134.70, 35.12]] }, // 山崎断層帯
  { color: COLOR_A_RANK, width: 2.0, coords: [[139.00, 35.28], [139.15, 35.35], [139.25, 35.40]] }, // 神縄・国府津-松田断層帯
  { color: COLOR_A_RANK, width: 2.0, coords: [[138.90, 34.95], [138.95, 35.10]] }, // 北伊豆断層帯

  // --- Zランク/その他主要活断層帯 ---
  { color: COLOR_Z_RANK, width: 1.6, coords: [[129.85, 32.75], [129.95, 32.95], [130.10, 33.20]] }, // 西山断層帯
  { color: COLOR_Z_RANK, width: 1.6, coords: [[130.05, 32.72], [130.25, 32.75], [130.45, 32.70]] }, // 雲仙断層群
  { color: COLOR_Z_RANK, width: 1.6, coords: [[135.78, 34.98], [135.83, 35.15], [135.90, 35.35]] }, // 花折断層帯
  { color: COLOR_Z_RANK, width: 1.6, coords: [[140.85, 37.10], [140.95, 37.50], [141.00, 37.90]] }  // 双葉断層
];

function createFaultRibbon(coords, widthDeg, color, surfaceOffset = 0.65) {
  // 座標列を細分化
  const denseCoords = [];
  const maxStep = 0.03;
  for (let i = 0; i < coords.length - 1; i++) {
    const c1 = coords[i];
    const c2 = coords[i + 1];
    const dx = c2[0] - c1[0];
    const dy = c2[1] - c1[1];
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / maxStep));

    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      denseCoords.push([c1[0] + dx * t, c1[1] + dy * t]);
    }
  }
  denseCoords.push(coords[coords.length - 1]);

  const halfWidth = widthDeg * 0.04; // 経度/緯度スケールに合わせた帯幅
  const positions = [];
  const indices = [];

  for (let i = 0; i < denseCoords.length; i++) {
    let pPrev = denseCoords[Math.max(0, i - 1)];
    let pNext = denseCoords[Math.min(denseCoords.length - 1, i + 1)];

    let dx = pNext[0] - pPrev[0];
    let dy = pNext[1] - pPrev[1];
    let len = Math.hypot(dx, dy);
    if (len < 1e-6) { dx = 1; dy = 0; len = 1; }

    // 進行方向に垂直な法線ベクトル (-dy, dx)
    const nx = -dy / len;
    const ny = dx / len;

    const lon = denseCoords[i][0];
    const lat = denseCoords[i][1];

    const leftLon = lon + nx * halfWidth;
    const leftLat = lat + ny * halfWidth;
    const rightLon = lon - nx * halfWidth;
    const rightLat = lat - ny * halfWidth;

    const vLeft = geoTo3D(leftLon, leftLat, 0, surfaceOffset);
    const vRight = geoTo3D(rightLon, rightLat, 0, surfaceOffset);

    positions.push(vLeft.x, vLeft.y, vLeft.z);
    positions.push(vRight.x, vRight.y, vRight.z);

    if (i < denseCoords.length - 1) {
      const base = i * 2;
      indices.push(base, base + 1, base + 2);
      indices.push(base + 1, base + 3, base + 2);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshBasicMaterial({
    color: color,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.75,
    depthWrite: false
  });

  return new THREE.Mesh(geo, mat);
}

function addFaults() {
  MAJOR_FAULTS.forEach(item => {
    // 活断層・構造線を帯（Ribbon Mesh）として立体描画
    const ribbonMesh = createFaultRibbon(item.coords, item.width || 2.0, item.color, 0.65);
    faultGroup.add(ribbonMesh);

    // 帯の中央に鮮明な中心線（Line）を薄く重ねて輪郭をはっきりさせる
    const lineMat = new THREE.LineBasicMaterial({
      color: item.color,
      transparent: true,
      opacity: 0.9
    });
    const pts = interpolateLine(item.coords, 0.04, 0.70);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    faultGroup.add(new THREE.Line(lineGeo, lineMat));
  });
}

async function loadMap(){
  const r=await fetch(GEOJSON_URL);
  if(!r.ok) throw new Error('日本地図の取得に失敗');
  addGeoJSON(await r.json());
  addFaults();
}

// 地震
const quakeGroup = new THREE.Group();
worldGroup.add(quakeGroup);

const quakeMeshes = new Map();

function getDepthColor(depth){
  const maxDepth = 300;
  const clamped = Math.max(0, Math.min(depth, maxDepth));
  const t = clamped / maxDepth;
  const hue = t * 0.666; // 0: 赤 (地表付近) ~ 0.666: 青 (深部)
  return new THREE.Color().setHSL(hue, 1.0, 0.5);
}

function createTextSprite(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = 'Bold 44px system-ui, sans-serif';
  ctx.fillStyle = '#' + color.getHexString();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 10, 64);

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(32, 16, 1);
  return sprite;
}

const depthRulerGroup = new THREE.Group();
worldGroup.add(depthRulerGroup);

function createDepthRuler() {
  const rulerLon = 146.5;
  const rulerLat = 34.5;
  const depths = [0, 50, 100, 150, 200, 250, 300];

  const pTop = geoTo3D(rulerLon, rulerLat, 0);
  const pBottom = geoTo3D(rulerLon, rulerLat, 300);

  // 主軸垂直線
  const axisGeo = new THREE.BufferGeometry().setFromPoints([pTop, pBottom]);
  const axisMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.8 });
  depthRulerGroup.add(new THREE.Line(axisGeo, axisMat));

  // 深度目盛り (Ticks & Labels)
  depths.forEach(d => {
    const p = geoTo3D(rulerLon, rulerLat, d);
    const color = getDepthColor(d);

    // 横フック目盛り線
    const pEnd = p.clone().add(new THREE.Vector3(12, 0, 0));
    const tickGeo = new THREE.BufferGeometry().setFromPoints([p, pEnd]);
    const tickMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
    depthRulerGroup.add(new THREE.Line(tickGeo, tickMat));

    // 深度テキストラベル ("0km", "50km", ...)
    const label = createTextSprite(`${d}km`, color);
    label.position.copy(pEnd).add(new THREE.Vector3(18, 0, 0));
    depthRulerGroup.add(label);
  });
}
createDepthRuler();

function scaleForMagnitude(m){
  if(!Number.isFinite(m) || m < 0) return 1.5;
  return Math.max(1.5, Math.pow(1.7, m-2.5));
}

function addQuake(q){
  const h=q.earthquake?.hypocenter;
  if(!h) return;
  if(h.latitude <= -100 || h.longitude <= -100 || h.depth < 0) return;
  if(quakeMeshes.has(q.id)) return;

  const p=geoTo3D(h.longitude,h.latitude,h.depth);
  const radius=Math.min(scaleForMagnitude(h.magnitude),18);
  const color=getDepthColor(h.depth);

  const geo=new THREE.SphereGeometry(radius,20,14);
  const mat=new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.6,
    depthWrite: false
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.copy(p);
  mesh.userData={q};
  quakeGroup.add(mesh);

  // 地表位置から震源までの線
  const surface=geoTo3D(h.longitude,h.latitude,0);
  const lineGeo=new THREE.BufferGeometry().setFromPoints([surface,p]);
  const lineMat=new THREE.LineBasicMaterial({color: color, transparent:true, opacity:.35});
  const line=new THREE.Line(lineGeo,lineMat);
  quakeGroup.add(line);

  // 震源横のマグニチュード & 深さテキストラベル
  const label = createQuakeLabel(magnitude(q), h.depth, color);
  label.position.copy(p).add(new THREE.Vector3(radius + 6, 2, 0));
  quakeGroup.add(label);

  quakeMeshes.set(q.id, {mesh, line, label});
}

function createQuakeLabel(magText, depthKm, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'Bold 28px system-ui, -apple-system, sans-serif';
  const text = `${magText} (${depthKm}km)`;

  // 高視認性のための黒縁取りストローク
  ctx.strokeStyle = 'rgba(5, 12, 18, 0.85)';
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, 10, 38);

  ctx.fillStyle = '#' + color.getHexString();
  ctx.fillText(text, 10, 38);

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(30, 7.5, 1);
  return sprite;
}

let earthquakes = [];
let currentView = 'today';

function validEarthquake(q){
  const h=q?.earthquake?.hypocenter;
  return q?.code===551 && h && h.latitude>-100 && h.longitude>-100 && h.depth>=0;
}

function quakeDate(q){
  return new Date(q.earthquake.time);
}

function formatTime(q){
  const d=quakeDate(q);
  return d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function magnitude(q){
  const m=q.earthquake.hypocenter.magnitude;
  return m>=0 ? `M${m.toFixed(1)}` : 'M--';
}

function viewItems(){
  const now=new Date();
  const start=new Date(now);
  if(currentView==='today'){
    start.setHours(0,0,0,0);
  }else if(currentView==='week'){
    start.setDate(now.getDate() - 7);
  }else if(currentView==='month'){
    start.setDate(1); start.setHours(0,0,0,0);
  }else{
    return earthquakes.slice(0,20);
  }
  return earthquakes.filter(q=>quakeDate(q)>=start);
}

function getMagnitudeBadgeClass(q){
  const m=q?.earthquake?.hypocenter?.magnitude;
  if(!Number.isFinite(m) || m < 0) return 'badge-blue';
  if(m < 3.0) return 'badge-blue';
  if(m < 5.0) return 'badge-yellow';
  return 'badge-red';
}

function renderDashboard(){
  const items=viewItems();
  const visibleIds=new Set(items.map(q=>q.id));
  quakeMeshes.forEach(({mesh, line, label}, id)=>{
    const isVisible=visibleIds.has(id);
    mesh.visible=isVisible;
    line.visible=isVisible;
    if(label) label.visible=isVisible;
  });

  const labels={today:'今日',week:'今週（直近7日）',month:'今月',recent:'直近20件'};
  document.querySelector('#summary').textContent=`${labels[currentView]}：${items.length}件`;

  const latest=items[0] || earthquakes[0];
  if(latest){
    const h=latest.earthquake.hypocenter;
    const d=h.depth>=0 ? `${h.depth} km` : '不明';
    document.querySelector('#latest').innerHTML=
      `<b>最新：${h.name||'震源不明'}</b><br>${magnitude(latest)} / 深さ ${d} / ${formatTime(latest)}`;
  }else{
    document.querySelector('#latest').textContent='該当する地震はありません';
  }

  const list=document.querySelector('#list');
  list.innerHTML='';
  items.forEach(q=>{
    const h=q.earthquake.hypocenter;
    const row=document.createElement('div');
    row.className='quake-row';
    const badgeClass=getMagnitudeBadgeClass(q);
    row.innerHTML=
      `<div class="quake-title"><span class="badge ${badgeClass}">${magnitude(q)}</span>${h.name||'震源不明'}</div>`+
      `<div class="quake-meta">${formatTime(q)}　深さ ${h.depth} km　緯度 ${h.latitude.toFixed(2)} / 経度 ${h.longitude.toFixed(2)}</div>`;
    row.onclick=()=>{
      const entry=quakeMeshes.get(q.id);
      if(entry && entry.mesh){
        controls.target.copy(entry.mesh.position);
        camera.position.copy(entry.mesh.position).add(new THREE.Vector3(70,70,70));
      }
    };
    list.appendChild(row);
  });
}

function setView(view){
  currentView=view;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  renderDashboard();
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

async function loadHistory(){
  let allData = [];
  const limit = 100;
  const maxPages = 10;
  for (let page = 0; page < maxPages; page++) {
    const offset = page * limit;
    const url = `https://api.p2pquake.net/v2/history?codes=551&limit=${limit}&offset=${offset}`;
    try {
      const r = await fetch(url);
      if (!r.ok) break;
      const data = await r.json();
      if (!Array.isArray(data) || data.length === 0) break;
      allData.push(...data);
      if (data.length < limit) break;
    } catch (e) {
      break;
    }
  }
  earthquakes = allData.filter(validEarthquake).sort((a,b)=>quakeDate(b)-quakeDate(a));
  earthquakes.forEach(addQuake);
  renderDashboard();
  document.querySelector('#status').textContent=`過去${earthquakes.length}件を取得 / WebSocket待機中`;
}

function connectWS(){
  const ws=new WebSocket('wss://api.p2pquake.net/v2/ws');
  ws.onopen=()=>document.querySelector('#status').textContent='接続中 — 新しい地震を待っています';
  ws.onmessage=e=>{
    try{
      const q=JSON.parse(e.data);
      if(validEarthquake(q)){
        if(!earthquakes.some(x=>x.id===q.id)){
          earthquakes.unshift(q);
          addQuake(q);
        }
        renderDashboard();
        document.querySelector('#status').textContent='リアルタイム受信中';
      }
    }catch(err){}
  };
  ws.onerror=()=>document.querySelector('#status').textContent='WebSocket接続エラー（履歴表示は継続）';
  ws.onclose=()=>setTimeout(connectWS,5000);
}

let isLightMode = false;

function toggleTheme(){
  isLightMode = !isLightMode;
  document.body.classList.toggle('light-mode', isLightMode);
  const themeBtn = document.querySelector('#theme-toggle');
  themeBtn.textContent = isLightMode ? '🌙 ダークモード' : '☀️ ライトモード';

  if(isLightMode){
    scene.background.set(0xf1f5f9);
    grid.visible = false;
    if(mapLineMat) mapLineMat.color.set(0x64748b);
    if(mapFillMat) mapFillMat.color.set(0xdbeade);
    if(faultLineMat) faultLineMat.color.set(0xd97706);
  } else {
    scene.background.set(0x071018);
    grid.visible = true;
    grid.material.color.set(0xffffff);
    grid.material.transparent = false;
    grid.material.opacity = 1.0;
    if(mapLineMat) mapLineMat.color.set(0x8fa9b8);
    if(mapFillMat) mapFillMat.color.set(0x152c38);
    if(faultLineMat) faultLineMat.color.set(0xef4444);
  }
}

document.querySelector('#theme-toggle').addEventListener('click', toggleTheme);

let isJshisLoaded = false;
const JSHIS_SAMPLE_MESHES = ['54401047N', '53394526N', '53393596N', '53394621N'];

async function loadJshisSubsurfaceData() {
  if (isJshisLoaded) return;
  document.querySelector('#status').textContent = 'J-SHIS 深部地下構造メッシュを取得中…';

  const jshisMat = new THREE.MeshStandardMaterial({
    color: 0x38bdf8,
    roughness: 0.4,
    metalness: 0.3,
    transparent: true,
    opacity: 0.7,
    side: THREE.DoubleSide
  });

  const jshisEdgeMat = new THREE.LineBasicMaterial({
    color: 0x0284c7,
    linewidth: 2
  });

  for (const code of JSHIS_SAMPLE_MESHES) {
    try {
      const url = `https://www.j-shis.bosai.go.jp/map/api/dstrct/V1/LYRD/meshinfo.geojson?meshcode=${code}`;
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();

      data.features?.forEach(feat => {
        const coords = feat.geometry?.coordinates?.[0];
        const depthMeters = parseFloat(feat.properties?.tn32 || '3000'); // S波速度3.2km/s基盤深度 (m)
        const depthKm = depthMeters / 1000.0;

        if (coords && coords.length >= 3) {
          const shape = new THREE.Shape();
          coords.forEach((p, i) => {
            const v = geoTo3D(p[0], p[1], depthKm);
            if (i === 0) shape.moveTo(v.x, -v.z);
            else shape.lineTo(v.x, -v.z);
          });
          shape.closePath();

          const geo = new THREE.ShapeGeometry(shape);
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vz = -pos.getY(i);
            const lon = LON0 + vx / SX;
            const lat = LAT0 - vz / SZ;
            const p3d = geoTo3D(lon, lat, depthKm);
            pos.setZ(i, p3d.y);
          }
          geo.computeVertexNormals();

          const mesh = new THREE.Mesh(geo, jshisMat);
          mesh.rotation.x = -Math.PI / 2;
          jshisGroup.add(mesh);

          // メッシュ枠線
          const edgePts = coords.map(p => geoTo3D(p[0], p[1], depthKm));
          const edgeGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
          jshisGroup.add(new THREE.Line(edgeGeo, jshisEdgeMat));
        }
      });
    } catch (e) {
      console.warn('J-SHIS fetch error for mesh', code, e);
    }
  }

  isJshisLoaded = true;
  document.querySelector('#status').textContent = 'J-SHIS 地盤構造レイヤー表示中';
}

document.querySelector('#jshis-toggle').addEventListener('click', async () => {
  jshisGroup.visible = !jshisGroup.visible;
  const btn = document.querySelector('#jshis-toggle');
  if (jshisGroup.visible) {
    btn.style.background = '#0284c7';
    btn.style.borderColor = '#38bdf8';
    btn.style.color = '#ffffff';
    await loadJshisSubsurfaceData();
  } else {
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

(async()=>{
  try{
    await loadMap();
    await loadHistory();
    connectWS();
  }catch(e){
    console.error(e);
    document.querySelector('#status').textContent='取得エラー: '+e.message;
  }
})();

function handleXRControllerScale(){
  const session = renderer.xr.getSession();
  if (!session || !session.inputSources) return;

  for (const source of session.inputSources) {
    if (source && source.gamepad) {
      const axes = source.gamepad.axes;
      if (!axes || axes.length === 0) continue;

      // WebXR standard gamepad: axes[3] or axes[1] for thumbstick Y-axis
      const thumbY = axes.length >= 4 ? axes[3] : (axes.length >= 2 ? axes[1] : 0);

      if (Math.abs(thumbY) > 0.15) {
        // Push thumbstick up (thumbY < 0) to scale up / zoom in; down (thumbY > 0) to scale down / zoom out
        const scaleFactor = 1.0 - thumbY * 0.025;
        const currentScale = worldGroup.scale.x;
        const newScale = Math.max(0.1, Math.min(15.0, currentScale * scaleFactor));
        worldGroup.scale.setScalar(newScale);
      }
    }
  }
}

function animate(){
  controls.update();
  handleXRControllerScale();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);
